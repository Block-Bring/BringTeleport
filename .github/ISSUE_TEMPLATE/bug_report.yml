name: 🐛 Bug 反馈
description: 报告插件的问题或崩溃
title: "🐛 "
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望的结果是什么？
      placeholder: |
        例如：死亡后输入 /back，落点被卡在方块里。
        期望：自动切换到附近的空地。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量写清每一步，方便别人照着重现。
      placeholder: |
        1. 在生存服中死亡
        2. 输入 /back
        3. 观察落点位置
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 插件版本
      description: plugins 目录下 jar 的文件名
      placeholder: BringTeleport-Paper-0.8.0.jar
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: 服务端版本
      description: /version 输出的第一行
      placeholder: 例如 Paper 1.21.4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台日志
      description: 有报错就贴相关日志（纯文本，不要截图）；没有可以留空
      render: shell
      placeholder: |
        [12:00:00] [Server thread/ERROR]: ...
