name: ${name}
version: ${version}
api-version: "${apiVersion}"
author: Block_Bring
main: top.imbring.bringteleport.BringTeleportPlugin

commands: { }

permissions:
  # Plugin-level permissions
  bringteleport.reload:
    description: 重载插件配置文件
    default: op
  bringteleport.update:
    description: 检查插件更新
    default: op

  # Warp feature permissions
  bringteleport.warp.create:
    description: 创建路径点
    default: true
  bringteleport.warp.del:
    description: 删除路径点
    default: true
  bringteleport.warp.del.other:
    description: 删除其他玩家创建的公有路径点
    default: op
  bringteleport.warp.info:
    description: 查看路径点信息
    default: true
  bringteleport.warp.rename:
    description: 重命名路径点
    default: true
  bringteleport.warp.tp:
    description: 传送至路径点
    default: true
  bringteleport.warp.star:
    description: 收藏路径点
    default: true

  # Death back feature permissions
  bringteleport.deathback:
    description: 死亡后返回死亡地点
    default: true

  # TPA feature permissions
  bringteleport.tpa.request:
    description: 发送或取消 TPA 传送请求
    default: true
  bringteleport.tpa.accept:
    description: 接受或拒绝 TPA 传送请求
    default: true
  bringteleport.tpa.back:
    description: 返回 TPA 传送前的位置
    default: true

  # Wildcards
  bringteleport.warp.*:
    description: 所有路径点权限
    default: op
    children:
      bringteleport.warp.create: true
      bringteleport.warp.del: true
      bringteleport.warp.del.other: true
      bringteleport.warp.info: true
      bringteleport.warp.rename: true
      bringteleport.warp.tp: true
      bringteleport.warp.star: true
  bringteleport.tpa.*:
    description: 所有 TPA 权限
    default: op
    children:
      bringteleport.tpa.request: true
      bringteleport.tpa.accept: true
      bringteleport.tpa.back: true
  bringteleport.*:
    description: 所有 BringTeleport 权限
    default: op
    children:
      bringteleport.reload: true
      bringteleport.update: true
      bringteleport.warp.*: true
      bringteleport.deathback: true
      bringteleport.tpa.*: true
