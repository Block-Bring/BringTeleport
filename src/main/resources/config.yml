timezone: '+8'
warp:
  delete-confirmation:
    enabled: true
    timeout: 10
  teleport:
    countdown:
      enabled: true
      delay: 3.0
      interval: 1
      display: both
      sound:
        enabled: true
        name: entity.experience_orb.pickup
        interval: 1
        volume: 1.0
        pitch: 1.0
      cancel-on-move:
        enabled: true
        display: chat
        sound:
          name: block.anvil.place
          volume: 1.0
          pitch: 1.0
    success:
      display: both
      sound:
        enabled: true
        name: entity.player.levelup
        volume: 1.0
        pitch: 1.0
death-back:
  enabled: true
  notify-on-respawn: true
  safe-point:
    enabled: true
    radius-horizontal: 32
    radius-vertical: 16
    effort: 2
tpa:
  timeout: 60
  request:
    sound:
      enabled: true
      name: block.note_block.bell
      volume: 1.0
      pitch: 0.9
  teleport:
    countdown:
      enabled: true
      delay: 3.0
      interval: 1
      display: both
      sound:
        enabled: true
        name: entity.experience_orb.pickup
        interval: 1
        volume: 1.0
        pitch: 1.0
      cancel-on-move:
        enabled: true
        display: chat
        sound:
          name: block.anvil.place
          volume: 1.0
          pitch: 1.0
    success:
      display: both
      sound:
        enabled: true
        name: entity.player.levelup
        volume: 1.0
        pitch: 1.0
update-checker:
  check-on-startup: true
  auto-check:
    enabled: true
    interval-hours: 6
  url: https://api.github.com/repos/Block-Bring/BringTeleport/releases/latest
config-version: 5
