# BringTeleport 配置文件
# 作者: ${author}

# 是否在消息前显示插件前缀
prefix-enabled: true

# 路径点信息中时间的显示时区（数据库存的是 UTC 时间，显示时转换到此区）
# 可直接填写与 UTC 的偏移，如 +8、-5、+08:30（无正负号按正偏移算）
# 也可填写 IANA 时区名，如 Asia/Shanghai、UTC、America/New_York
# 填 system 或留空则使用服务器系统时区
timezone: "+8"

warp:
  delete-confirmation:
    # 是否启用删除确认
    enabled: true
    # 确认超时时间（秒），超过需重新输入删除命令
    timeout: 10.0
  teleport:
    countdown:
      # 是否启用传送倒计时
      enabled: true
      # 传送延迟（秒）
      delay: 3.0
      # 倒计时更新频率（秒），1 = 每秒更新，0.1 = 每 0.1 秒更新
      interval: 1
      # 倒计时显示方式: subtitle / title / both / chat
      display: "both"
      sound:
        # 是否启用倒计时提示音
        enabled: true
        # 声音名称（可省略命名空间，如 block.note_block.pling）
        name: "entity.experience_orb.pickup"
        # 提示音播放间隔（每 N 次倒计时更新播放一次），1 = 每次更新都播放
        interval: 1
        # 音量（0.0 - 1.0）
        volume: 1.0
        # 音调（0.5 - 2.0）
        pitch: 1.0
      cancel-on-move:
        # 倒计时期间玩家移动是否取消传送
        enabled: true
        # 取消提示显示方式: subtitle / title / both / chat
        display: "chat"
        sound:
          # 取消时的提示音
          name: "block.anvil.place"
          volume: 1.0
          pitch: 1.0
    success:
      # 传送成功提示显示方式: subtitle / title / both / chat
      display: "title"
      sound:
        # 是否启用传送成功提示音
        enabled: true
        # 声音名称（默认玩家升级音效）
        name: "entity.player.levelup"
        # 音量（0.0 - 1.0）
        volume: 1.0
        # 音调（0.5 - 2.0）
        pitch: 1.0

death-back:
  # 是否启用死亡返回功能（玩家死亡后用 /back 返回死亡地点）
  enabled: true
  # 玩家复活后是否提示可以用 /back 返回死亡地点
  notify-on-respawn: true
  safe-point:
    # 死亡点无法安全站立（如掉进岩浆）时，寻找最近的安全落脚点，
    # /back 会传送到安全点而非危险位置
    enabled: true
    # 搜索半径（格）：水平 / 垂直（垂直为上下各多少格）
    radius-horizontal: 32
    radius-vertical: 16

# 插件配置版本
config-version: 2
